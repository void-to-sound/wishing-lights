<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Steel tongue drum</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #d7dee6;
        --muted: #93a0ae;
        --line: rgba(215, 222, 230, 0.16);
        --panel: rgba(18, 22, 28, 0.72);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(ellipse at 50% 0%, #2a3542 0%, #14181e 46%, #0c0e12 100%);
        color: var(--ink);
        font-family: "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif;
      }

      .page {
        width: min(640px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0 56px;
      }

      .studio {
        margin: 0;
        color: var(--muted);
        font-size: 0.78rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 6px 0 0;
        font-size: 1.8rem;
        font-weight: 560;
        letter-spacing: -0.03em;
      }

      .lede {
        margin: 8px 0 0;
        max-width: 38rem;
        color: var(--muted);
        line-height: 1.45;
      }

      .drum {
        width: min(100%, 540px);
        margin: 28px auto 8px;
      }

      .drum svg {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible;
      }

      .tongue {
        cursor: pointer;
      }

      .tongue .face {
        stroke: rgba(255, 255, 255, 0.28);
        stroke-width: 1.5;
      }

      .tongue:hover .face,
      .tongue:focus-visible .face {
        filter: brightness(1.14);
      }

      .tongue.is-struck .face {
        filter: brightness(1.72);
      }

      .tongue.is-struck .note {
        fill: #f7fbff;
      }

      .tongue:focus-visible {
        outline: none;
      }

      .tongue:focus-visible .face {
        stroke: #f4f7fb;
        stroke-width: 2.5;
      }

      .note {
        font-family: "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 18px;
        font-weight: 650;
        letter-spacing: 0.04em;
        fill: #1c2630;
        pointer-events: none;
        user-select: none;
      }

      .controls {
        display: grid;
        gap: 18px;
        margin-top: 12px;
      }

      .field {
        display: grid;
        gap: 8px;
      }

      .field-label {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        color: var(--ink);
        font-size: 0.92rem;
      }

      output {
        color: #e7eef5;
        font-variant-numeric: tabular-nums;
      }

      input[type="range"] {
        width: 100%;
        margin: 0;
        accent-color: #b7c5d3;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      button {
        touch-action: manipulation;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #1c242d;
        color: var(--ink);
        padding: 10px 14px;
        font: inherit;
        font-size: 0.92rem;
        cursor: pointer;
      }

      button:hover {
        background: #26313b;
      }

      button:focus-visible {
        outline: 2px solid #d5dee8;
        outline-offset: 2px;
      }

      #enable[aria-pressed="true"] {
        background: #31404d;
      }

      .status {
        min-height: 1.4em;
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .footnote {
        margin: 18px 0 0;
        color: #6f7c8a;
        font-size: 0.82rem;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <p class="studio">Void to Sound</p>
      <h1>Steel tongue drum</h1>
      <p class="lede">
        Eight tongues around a steel shell. Each strike keeps ringing while the next one starts.
      </p>

      <div class="drum">
        <svg viewBox="0 0 640 640" role="group" aria-label="Steel tongue drum">
          <defs>
            <radialGradient id="shell" cx="38%" cy="32%" r="72%">
              <stop offset="0%" stop-color="#d5dee6" />
              <stop offset="22%" stop-color="#9eacba" />
              <stop offset="58%" stop-color="#6d7b89" />
              <stop offset="100%" stop-color="#3c4652" />
            </radialGradient>
            <linearGradient id="tongue-metal" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#e2ebf2" />
              <stop offset="38%" stop-color="#a9b7c4" />
              <stop offset="100%" stop-color="#667482" />
            </linearGradient>
            <radialGradient id="hub-metal" cx="36%" cy="32%" r="70%">
              <stop offset="0%" stop-color="#f0f5f9" />
              <stop offset="42%" stop-color="#8b99a7" />
              <stop offset="100%" stop-color="#3e4854" />
            </radialGradient>
            <filter id="drum-shadow" x="-30%" y="-30%" width="160%" height="160%">
              <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#000000" flood-opacity="0.42" />
            </filter>
            <filter id="tongue-shadow" x="-40%" y="-40%" width="180%" height="180%">
              <feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#000000" flood-opacity="0.28" />
            </filter>
          </defs>

          <circle cx="320" cy="320" r="300" fill="url(#shell)" filter="url(#drum-shadow)" />
          <circle cx="320" cy="320" r="286" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="2" />
          <ellipse
            cx="246"
            cy="196"
            rx="128"
            ry="72"
            fill="rgba(255,255,255,0.14)"
            transform="rotate(-32 246 196)"
          />
          <circle cx="320" cy="320" r="248" fill="none" stroke="rgba(12,16,22,0.28)" stroke-width="18" />

          <g class="tongue" data-index="0" tabindex="0" role="button" aria-label="Play C4" transform="rotate(0 320 320)">
            <path class="slot" fill="#1a222b" d="M320 48c29 6 40 34 36 84-4 48-17 84-36 94-19-10-32-46-36-94-4-50 7-78 36-84z" />
            <path class="face" fill="url(#tongue-metal)" filter="url(#tongue-shadow)" d="M320 54c26 6 36 32 32 82-4 48-16 82-32 90-16-8-28-42-32-90-4-50 6-76 32-82z" />
            <text class="note" x="320" y="150" text-anchor="middle">C4</text>
          </g>
          <g class="tongue" data-index="1" tabindex="0" role="button" aria-label="Play D4" transform="rotate(45 320 320)">
            <path class="slot" fill="#1a222b" d="M320 48c29 6 40 34 36 84-4 48-17 84-36 94-19-10-32-46-36-94-4-50 7-78 36-84z" />
            <path class="face" fill="url(#tongue-metal)" filter="url(#tongue-shadow)" d="M320 54c26 6 36 32 32 82-4 48-16 82-32 90-16-8-28-42-32-90-4-50 6-76 32-82z" />
            <text class="note" x="320" y="150" text-anchor="middle" transform="rotate(-45 320 150)">D4</text>
          </g>
          <g class="tongue" data-index="2" tabindex="0" role="button" aria-label="Play E4" transform="rotate(90 320 320)">
            <path class="slot" fill="#1a222b" d="M320 48c29 6 40 34 36 84-4 48-17 84-36 94-19-10-32-46-36-94-4-50 7-78 36-84z" />
            <path class="face" fill="url(#tongue-metal)" filter="url(#tongue-shadow)" d="M320 54c26 6 36 32 32 82-4 48-16 82-32 90-16-8-28-42-32-90-4-50 6-76 32-82z" />
            <text class="note" x="320" y="150" text-anchor="middle" transform="rotate(-90 320 150)">E4</text>
          </g>
          <g class="tongue" data-index="3" tabindex="0" role="button" aria-label="Play G4" transform="rotate(135 320 320)">
            <path class="slot" fill="#1a222b" d="M320 48c29 6 40 34 36 84-4 48-17 84-36 94-19-10-32-46-36-94-4-50 7-78 36-84z" />
            <path class="face" fill="url(#tongue-metal)" filter="url(#tongue-shadow)" d="M320 54c26 6 36 32 32 82-4 48-16 82-32 90-16-8-28-42-32-90-4-50 6-76 32-82z" />
            <text class="note" x="320" y="150" text-anchor="middle" transform="rotate(-135 320 150)">G4</text>
          </g>
          <g class="tongue" data-index="4" tabindex="0" role="button" aria-label="Play A4" transform="rotate(180 320 320)">
            <path class="slot" fill="#1a222b" d="M320 48c29 6 40 34 36 84-4 48-17 84-36 94-19-10-32-46-36-94-4-50 7-78 36-84z" />
            <path class="face" fill="url(#tongue-metal)" filter="url(#tongue-shadow)" d="M320 54c26 6 36 32 32 82-4 48-16 82-32 90-16-8-28-42-32-90-4-50 6-76 32-82z" />
            <text class="note" x="320" y="150" text-anchor="middle" transform="rotate(-180 320 150)">A4</text>
          </g>
          <g class="tongue" data-index="5" tabindex="0" role="button" aria-label="Play C5" transform="rotate(225 320 320)">
            <path class="slot" fill="#1a222b" d="M320 48c29 6 40 34 36 84-4 48-17 84-36 94-19-10-32-46-36-94-4-50 7-78 36-84z" />
            <path class="face" fill="url(#tongue-metal)" filter="url(#tongue-shadow)" d="M320 54c26 6 36 32 32 82-4 48-16 82-32 90-16-8-28-42-32-90-4-50 6-76 32-82z" />
            <text class="note" x="320" y="150" text-anchor="middle" transform="rotate(-225 320 150)">C5</text>
          </g>
          <g class="tongue" data-index="6" tabindex="0" role="button" aria-label="Play D5" transform="rotate(270 320 320)">
            <path class="slot" fill="#1a222b" d="M320 48c29 6 40 34 36 84-4 48-17 84-36 94-19-10-32-46-36-94-4-50 7-78 36-84z" />
            <path class="face" fill="url(#tongue-metal)" filter="url(#tongue-shadow)" d="M320 54c26 6 36 32 32 82-4 48-16 82-32 90-16-8-28-42-32-90-4-50 6-76 32-82z" />
            <text class="note" x="320" y="150" text-anchor="middle" transform="rotate(-270 320 150)">D5</text>
          </g>
          <g class="tongue" data-index="7" tabindex="0" role="button" aria-label="Play E5" transform="rotate(315 320 320)">
            <path class="slot" fill="#1a222b" d="M320 48c29 6 40 34 36 84-4 48-17 84-36 94-19-10-32-46-36-94-4-50 7-78 36-84z" />
            <path class="face" fill="url(#tongue-metal)" filter="url(#tongue-shadow)" d="M320 54c26 6 36 32 32 82-4 48-16 82-32 90-16-8-28-42-32-90-4-50 6-76 32-82z" />
            <text class="note" x="320" y="150" text-anchor="middle" transform="rotate(-315 320 150)">E5</text>
          </g>

          <g pointer-events="none">
            <circle cx="320" cy="320" r="86" fill="url(#hub-metal)" />
            <circle cx="320" cy="320" r="86" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="1.5" />
            <circle cx="292" cy="292" r="18" fill="rgba(255,255,255,0.28)" />
            <circle cx="320" cy="320" r="8" fill="#2a333c" />
            <circle cx="317" cy="317" r="2.5" fill="rgba(255,255,255,0.55)" />
          </g>
        </svg>
      </div>

      <div class="controls">
        <label class="field">
          <span class="field-label">
            <span>Resonance / Sustain</span>
            <span><output id="decay-readout">3.50</output> s</span>
          </span>
          <input id="decay" type="range" min="0.6" max="6" step="0.01" value="3.5" />
        </label>

        <label class="field">
          <span class="field-label">
            <span>Metallic Overtones</span>
            <span><output id="metal-readout">0.34</output></span>
          </span>
          <input id="metal" type="range" min="0" max="1" step="0.01" value="0.34" />
        </label>

        <label class="field">
          <span class="field-label">
            <span>Strike Softness</span>
            <span><output id="softness-readout">0.65</output></span>
          </span>
          <input id="softness" type="range" min="0" max="1" step="0.01" value="0.65" />
        </label>

        <div class="actions">
          <button id="enable" type="button" aria-pressed="false">Enable Sound</button>
          <button id="chord" type="button">Play C Chord</button>
          <button id="melody" type="button">Gentle Melody</button>
          <button id="stop" type="button">Stop</button>
        </div>
        <p id="status" class="status" role="status">Sound starts after you enable it or play.</p>
      </div>

      <p class="footnote">
        Reference experiment for later ornament sounds. The partials, noise burst, and echo stay fixed.
      </p>
    </main>
    <script src="./main.js"></script>
  </body>
</html>
